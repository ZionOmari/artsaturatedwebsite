[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  REACT_APP_STRIPE_PUBLISHABLE_KEY = "YOUR_LIVE_STRIPE_KEY_HERE"
  REACT_APP_SITE_URL = "https://artsaturated.com"

[context.deploy-preview.environment]
  REACT_APP_STRIPE_PUBLISHABLE_KEY = "YOUR_TEST_STRIPE_KEY_HERE"
  REACT_APP_SITE_URL = "https://deploy-preview-PREVIEW_ID--artsaturated.netlify.app"